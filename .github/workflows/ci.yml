name: SAGE CI

on:
  push:
    branches: [main, "fix/**", "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Check PR head includes current main
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch origin main --no-tags
          git fetch origin "refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-${PR_NUMBER}" --no-tags
          if ! git merge-base --is-ancestor origin/main "refs/remotes/origin/pr-${PR_NUMBER}"; then
            echo "::error::This PR branch is behind current main. Update it from main and rerun CI."
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate AI coordination claims
        run: python scripts/check_ai_coordination.py
      - name: Compile Python modules
        run: python -m compileall -q brain database tasks execution app research tools agents missions memory permissions web identity world_intelligence
      - name: Static Python lint
        run: python -m pip install ruff && ruff check --select F brain database tasks execution app research tools agents missions memory permissions web identity world_intelligence sales tests
      - name: Run tests
        run: python -m pytest -q tests

  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - name: Get packages
        run: flutter pub get
      - name: Analyze Flutter app
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
